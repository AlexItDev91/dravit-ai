name: Dravit skill package

on:
  push:
    branches: [main]
    tags: ['dravit-skill-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and links
        run: python3 scripts/package.py validate
      - name: Build draft artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/package.py build --output dist
      - name: Require recorded evaluation and build release
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/package.py build --release --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: dravit-skill-package
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/dravit-skill-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dravit-skill-package
          path: dist/
      - name: Publish immutable Git release in the configured separate public repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          configured_repository="$(python3 -c 'import json; print(json.load(open("packaging/publication.json"))["repository"])')"
          test "$configured_repository" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
